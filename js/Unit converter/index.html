<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <section class="background" aria-labelledby="converter-title">
            <h1 class="heading" id="converter-title">Metric/Imperial Unit Conversion</h1>
            <label class="number-label" for="number-to-convert">Number to convert</label>
            <input id="number-to-convert" name="number-to-convert" type="number" value="20" aria-label="Number to convert">
            <button id="convert" type="button">Convert</button>
        </section>

        <section class="group1" aria-labelledby="length-title">
            <div class="gridlist">
                <h2 id="length-title">Length (Meter/Feet)</h2>
                <p id="p1">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
        </section>

        <section class="group1" aria-labelledby="volume-title">
            <div class="gridlist">
                <h2 id="volume-title">Volume (Liters/Gallons)</h2>
                <p id="p2">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </div>
        </section>

        <section class="group1" aria-labelledby="mass-title">
            <div class="gridlist">
                <h2 id="mass-title">Mass (Kilograms/Pounds)</h2>
                <p id="p3">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
